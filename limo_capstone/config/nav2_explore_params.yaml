# ============================================================
# Nav2 파라미터 (자율 탐색/매핑용) - limo_auto_mapping.launch.py에서 사용
# 각 최상위 키는 Nav2 노드 이름과 일치해야 한다.
# ============================================================

# [AMCL] 정적 지도 기반 파티클 필터 위치 추정
# (limo_auto_mapping에서는 SLAM Toolbox가 위치 추정을 하므로 실제로 쓰이지 않음. limo_nav2용 참고값)
amcl:
  ros__parameters:
    use_sim_time: False  # 시뮬레이션 시계 사용 여부 (실제 로봇: False)
    alpha1: 0.2  # 회전 운동 시 회전 노이즈 (odom 모델 불확실성)
    alpha2: 0.2  # 이동 시 회전 노이즈
    alpha3: 0.2  # 이동 시 이동 노이즈
    alpha4: 0.2  # 회전 시 이동 노이즈
    alpha5: 0.2  # (omni 모델 전용) 측면 이동 노이즈
    base_frame_id: "base_link" # base_footprint -> base_link로 변경
    beam_skip_distance: 0.5  # 빔 건너뛰기 거리
    beam_skip_error_threshold: 0.9  # 빔 건너뛰기 오차 임계값
    beam_skip_threshold: 0.3  # 빔 건너뛰기 임계 비율
    do_beamskip: false  # 빔 건너뛰기 사용 여부
    global_frame_id: "map"  # 전역(지도) 좌표계
    lambda_short: 0.1  # 장애물 우도 지수 감쇠 파라미터(short 모델용)
    laser_likelihood_max_dist: 2.0  # likelihood_field 모델에서 장애물 영향 최대 거리(m)
    laser_max_range: 10.0 # 기존 100.0 -> 10.0 (실제 LIMO LiDAR 스펙 8~10m에 맞춤)
    laser_min_range: 0.05 # 기존 -1.0 -> 0.05 (비정상 음수 필터링)
    laser_model_type: "likelihood_field"  # 라이다 관측 모델 (likelihood_field: 빠르고 안정적)
    max_beams: 60  # 한 번 갱신에 사용할 레이저 빔 수 (적을수록 CPU 절약)
    max_particles: 2000  # 파티클 최대 개수 (많을수록 정확/CPU 증가)
    min_particles: 500  # 파티클 최소 개수
    odom_frame_id: "odom"  # 오도메트리 좌표계
    pf_err: 0.05  # 파티클 필터 오차 허용치(KLD sampling)
    pf_z: 0.99  # 파티클 필터 신뢰 수준
    recovery_alpha_fast: 0.0  # 복구용 빠른 가중치 감쇠율 (0=복구 비활성)
    recovery_alpha_slow: 0.0  # 복구용 느린 가중치 감쇠율
    resample_interval: 1  # N번 갱신마다 리샘플링
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 로봇 모션 모델 (차동 구동)
    save_pose_rate: 0.5  # 추정 자세 저장 주기(Hz)
    sigma_hit: 0.2  # hit 모델 가우시안 표준편차(m)
    tf_broadcast: true  # map->odom TF 발행 여부
    transform_tolerance: 1.0  # TF 시간 허용 오차(초)
    update_min_a: 0.10 # 기존 0.20 -> 0.10 (약 5.7도 회전 시 위치 즉시 갱신)
    update_min_d: 0.10 # 기존 0.25 -> 0.10 (10cm만 움직여도 위치 즉시 갱신)
    z_hit: 0.5  # z_hit: 정상 측정 가중치
    z_max: 0.05  # z_max: 최대거리 측정 가중치
    z_rand: 0.5  # z_rand: 랜덤 노이즈 가중치
    z_short: 0.05  # z_short: 짧은 측정(동적 장애물) 가중치
    scan_topic: scan  # 라이다 토픽 이름

# [BT Navigator] 행동트리(Behavior Tree)로 내비게이션 전체 흐름(계획->주행->복구)을 총괄
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map  # BT 네비게이터 전역 좌표계
    robot_base_frame: base_link  # 로봇 기준 프레임
    odom_topic: /odom  # 오도메트리 토픽 (속도 정보 구독)
    bt_loop_duration: 10  # 행동트리 실행 주기(ms)
    default_server_timeout: 20  # 액션 서버 응답 대기 시간(ms)
    wait_for_service_timeout: 1000  # 서비스 대기 시간(ms)
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
      # 행동트리에서 사용할 BT 노드 플러그인 라이브러리 목록 (Nav2 기본값 그대로)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# BT Navigator 내부 rclcpp 노드 (시계 설정만 필요)
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# [Controller Server] 로컬 플래너 - 경로를 따라 실제 속도 명령(cmd_vel)을 생성
controller_server:
  ros__parameters:
    use_sim_time: False  # 컨트롤러 서버 시계 설정
    controller_frequency: 20.0  # 로컬 제어 주기(Hz)
    min_x_velocity_threshold: 0.001  # 이 값 미만의 x 속도는 '정지'로 간주(m/s)
    min_y_velocity_threshold: 0.5  # y 속도 임계값 (차동 구동은 y 이동 불가이므로 사실상 무관)
    min_theta_velocity_threshold: 0.001  # 이 값 미만의 회전 속도는 '정지'로 간주(rad/s)
    failure_tolerance: 0.3  # 제어 실패를 허용하는 시간(초) 후 실패 처리
    progress_checker_plugin: "progress_checker"  # 사용할 progress checker 이름
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"  | 사용할 goal checker 목록
    controller_plugins: ["FollowPath"]  # 사용할 로컬 플래너(컨트롤러) 목록

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 진행 판정 플러그인
      required_movement_radius: 0.5  # 이 반경(m) 이상 움직여야 '진전 있음'으로 판정
      movement_time_allowance: 10.0  # 위 이동이 있어야 하는 제한 시간(초). 초과 시 실패
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True  # 목표 도달 후에도 도달 상태 유지
      plugin: "nav2_controller::SimpleGoalChecker"  # 목표 도달 판정 플러그인
      xy_goal_tolerance: 0.25  # 목표 위치 허용 오차(m)
      yaw_goal_tolerance: 0.25  # 목표 방향 허용 오차(rad)
    # Regulated Pure Pursuit parameters (Optimized for 4-wheel Diff-drive)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.26                       # 순항 선속도 (m/s)
      lookahead_dist: 0.50                           # 기본 전방 주시 거리 (m)
      min_lookahead_dist: 0.25                       # 최소 전방 주시 거리 (m)
      max_lookahead_dist: 0.80                       # 최대 전방 주시 거리 (m)
      lookahead_time: 1.5                            # 속도 비례 lookahead 시간 (s)
      transform_tolerance: 0.2                       # TF 지연 허용 시간 (s)
      use_velocity_scaled_lookahead_dist: false      # 속도 비례 lookahead 사용 여부
      min_approach_linear_velocity: 0.08             # 목표 접근 시 최저 속도 (m/s)
      approach_velocity_scaling_dist: 0.60           # 목표 접근 감속 시작 거리 (m)
      use_collision_detection: true                  # 전방 충돌 사전 감지 활성화
      max_allowed_time_to_collision_up_to_carrot: 1.0 # 충돌 여유 시간 (s)
      use_regulated_linear_velocity_scaling: true    # 급선회 곡률 기반 감속 활성화
      use_cost_regulated_linear_velocity_scaling: true # 코스트맵 장애물 근접 시 자동 감속
      regulated_linear_scaling_min_radius: 0.45      # 곡률 감속 기준 최소 반경 (m)
      regulated_linear_scaling_min_speed: 0.08       # 곡률/코스트 감속 시 보장 최저 속도 (m/s)
      use_rotate_to_heading: true                    # 4륜 차동 필수: 큰 헤딩 오차 시 제자리 회전 선행
      rotate_to_heading_angular_vel: 0.8             # 제자리 회전 각속도 (rad/s)
      rotate_to_heading_min_angle: 0.785             # 제자리 회전 트리거 각도 (약 45도, rad)
      max_angular_accel: 2.5                         # 최대 각가속도 (rad/s²)
      allow_reversing: false                         # 후방 센서 부재로 인한 후진 금지
      max_robot_pose_search_dist: 10.0               # 경로 상 로봇 최근접점 탐색 최대 거리 (m)
      use_interpolation: true                        # 경로 보간 사용

# [Local Costmap] 로봇 주변 3x3m의 장애물 지도 (충돌 회피용, odom 기준)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  # 로컬 costmap 갱신 주기(Hz)
      publish_frequency: 2.0  # RViz 발행 주기(Hz)
      global_frame: odom  # 로컬 costmap 기준 프레임 (odom: 드리프트 없이 부드럽게 움직임)
      robot_base_frame: base_link
      use_sim_time: False  # 시계 설정
      rolling_window: true  # 로봇 중심으로 따라 움직이는 창 방식
      width: 3  # 창 가로 크기(m)
      height: 3  # 창 세로 크기(m)
      resolution: 0.05  # 격자 해상도(m/cell)
      robot_radius: 0.19  # 로봇 반경(m) - 원형 footprint
      plugins: ["voxel_layer", "inflation_layer"]  # 사용 레이어 (장애물 + 팽창)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0      # 3.0 -> 7.0 (벽에서 5cm만 떨어져도 안전 감쇠)
        inflation_radius: 0.30         # 0.55 -> 0.30 (LIMO에 맞춘 슬림한 안전 마진)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True  # 장애물 레이어 활성화
        publish_voxel_map: True  # 복셀 맵 발행
        origin_z: 0.0  # z 원점
        z_resolution: 0.05  # z 해상도(m)
        z_voxels: 16  # z 방향 복셀 개수
        max_obstacle_height: 2.0  # 인식할 최대 장애물 높이(m)
        mark_threshold: 0  # 장애물로 표시할 최소 복셀 수
        observation_sources: scan depth_obstacles  # 관측 소스 이름 (2D 라이다 + 3D Depth 카메라 장애물)
        scan:
          topic: /scan  # 라이다 토픽
          max_obstacle_height: 2.0  # 이 높이 이하만 장애물로 처리
          clearing: True  # 빈 공간 지우기(레이트레이싱) 사용
          marking: True  # 장애물 표시 사용
          data_type: "LaserScan"  # 입력 데이터 타입
          raytrace_max_range: 3.0  # 이 거리(m)까지 레이를 쏘아 빈 공간 제거
          raytrace_min_range: 0.0  # 레이트레이싱 최소 거리
          obstacle_max_range: 2.5  # 이 거리(m) 이내의 장애물만 표시
          obstacle_min_range: 0.0  # 장애물 최소 거리
        depth_obstacles:
          topic: /depth_obstacles/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.02
          max_obstacle_height: 0.40
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 지도 토픽을 transient_local QoS로 구독 (늦게 켜져도 수신)
      always_send_full_costmap: True  # 항상 전체 costmap 발행 (RViz 갱신 안정)

# [Global Costmap] 전체 지도 기준 장애물 지도 (전역 경로 계획용)
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # 전역 costmap 갱신 주기(Hz)
      publish_frequency: 1.0  # 발행 주기(Hz)
      global_frame: map  # 전역 좌표계(map)
      robot_base_frame: base_link
      use_sim_time: False  # 시계 설정
      robot_radius: 0.19  # 로봇 반경(m)
      resolution: 0.05  # 해상도(m/cell)
      track_unknown_space: true  # 미지 영역을 별도 값(-1)으로 추적 (탐색에 필요)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 사용 레이어 (정적지도, 장애물, 팽창)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True  # 레이어 활성화
        observation_sources: scan  # 관측 소스 이름
        scan:
          topic: /scan  # 라이다 토픽
          max_obstacle_height: 2.0  # 최대 장애물 높이(m)
          clearing: True  # 빈 공간 지우기 사용
          marking: True  # 장애물 표시 사용
          data_type: "LaserScan"  # 데이터 타입
          raytrace_max_range: 3.0  # 레이트레이싱 최대 거리(m)
          raytrace_min_range: 0.0  # 레이트레이싱 최소 거리
          obstacle_max_range: 2.5  # 장애물 표시 최대 거리(m)
          obstacle_min_range: 0.0  # 장애물 표시 최소 거리
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 지도 transient_local QoS 구독
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0      # 3.0 -> 7.0 (벽에서 5cm만 떨어져도 안전 감쇠)
        inflation_radius: 0.30         # 0.55 -> 0.30 (LIMO에 맞춘 슬림한 안전 마진)
      always_send_full_costmap: True  # 항상 전체 costmap 발행

# [Map Server] 저장된 지도 제공 (매핑 중에는 사용 안 함)
map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""  # launch의 map 인자로 덮어쓰므로 비워둠

# [Map Saver] 지도 저장 서비스 설정
map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0  # 저장 대기 시간(초)
    free_thresh_default: 0.25  # 이 확률 미만이면 '빈 공간'으로 저장
    occupied_thresh_default: 0.65  # 이 확률 초과면 '장애물'로 저장
    map_subscribe_transient_local: True  # transient_local QoS 구독

# [Planner Server] 전역 경로 계획
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # 예상 경로 계획 주기(Hz)
    use_sim_time: False
    planner_plugins: ["GridBased"]  # 사용할 전역 플래너 목록
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # 전역 플래너: NavFn (Dijkstra/A*)
      tolerance: 0.5  # 목표 주변 허용 반경(m) - 목표가 장애물이어도 근처로 계획
      use_astar: false  # true: A*, false: Dijkstra
      allow_unknown: true  # 미지 영역(-1)을 통과하는 경로 허용 (탐색 시 필수)

# [Smoother Server] 전역 경로를 부드럽게 다듬음
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]  # 사용할 경로 스무더 목록
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # 단순 스무더
      tolerance: 1.0e-10  # 수렴 허용 오차
      max_its: 1000  # 최대 반복 횟수
      do_refinement: True  # 경로 정제 단계 수행

# [Behavior Server] 막혔을 때 복구 행동(회전, 후진 등) 실행
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw  # 행동 실행에 사용할 costmap 토픽
    footprint_topic: local_costmap/published_footprint  # 로봇 footprint 토픽
    cycle_frequency: 10.0  # 행동 서버 주기(Hz)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # 사용할 복구 행동 목록
    spin:
      plugin: "nav2_behaviors/Spin"  # 제자리 회전
    backup:
      plugin: "nav2_behaviors/BackUp"  # 후진
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"  # 지정 방향 직진
    wait:
      plugin: "nav2_behaviors/Wait"  # 대기
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"  # 보조 원격 조종
    global_frame: odom  # 행동 기준 프레임
    robot_base_frame: base_link  # 로봇 프레임
    transform_tolerance: 0.1  # TF 허용 오차(초)
    use_sim_time: false
    simulate_ahead_time: 2.0  # 충돌 예측 시간(초)
    max_rotational_vel: 1.0  # 최대 회전 속도(rad/s)
    min_rotational_vel: 0.4  # 최소 회전 속도(rad/s)
    rotational_acc_lim: 3.2  # 회전 가속 한계(rad/s²)

# [Robot State Publisher] URDF 기반 TF 발행
robot_state_publisher:
  ros__parameters:
    use_sim_time: False

# [Waypoint Follower] 여러 웨이포인트 순차 주행
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20  # 웨이포인트 루프 주기(Hz)
    stop_on_failure: false  # 웨이포인트 실패 시에도 계속 진행
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 각 웨이포인트에서 수행할 작업 플러그인
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 웨이포인트 도착 시 대기
      enabled: True  # 활성화
      waypoint_pause_duration: 200  # 대기 시간(ms)

# [Velocity Smoother] 속도 명령을 가감속 한계 내로 부드럽게 변환 (급가속 방지)
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0  # 스무딩 주기(Hz)
    scale_velocities: False  # 속도 스케일링 비활성
    feedback: "OPEN_LOOP"  # OPEN_LOOP: 명령 속도를 현재 속도로 가정 (오도 피드백 미사용)
    max_velocity: [0.26, 0.0, 1.0]  # 최대 속도 [x(m/s), y, 회전(rad/s)]
    min_velocity: [-0.26, 0.0, -1.0]  # 최소 속도 (음수=후진 허용)
    max_accel: [2.5, 0.0, 3.2]  # 최대 가속 [x, y, theta]
    max_decel: [-2.5, 0.0, -3.2]  # 최대 감속 [x, y, theta]
    odom_topic: "odom"  # 오도메트리 토픽
    odom_duration: 0.1  # 오도메트리 평균 시간(초)
    deadband_velocity: [0.0, 0.0, 0.0]  # 이 값 이하의 속도는 0으로 처리(데드밴드)
    velocity_timeout: 1.0  # 명령 입력이 이 시간(초) 동안 없으면 정지
