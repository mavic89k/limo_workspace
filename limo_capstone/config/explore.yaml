explore_node:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.33     # 3초마다 새로운 프론티어 탐색
    progress_timeout: 25.0      # 10초간 진전이 없으면 다음 프론티어로 전환 # 10초에서 25초로 변경
    potential_scale: 3.0        # 목표를 고를 때 '거리'를 얼마나 중요하게 볼지 가중치
    orientation_scale: 0.0      # (사용 안 함) 목표의 방향성 가중치
    gain_scale: 1.0             # 목표를 고를 때 '개척할 수 있는 면적'을 얼마나 중요하게 볼지 가중치
    transform_tolerance: 0.6    # 좌표계(TF) 조회 시 허용하는 딜레이 오차 (0.6초) - CPU 과부하로 인한 에러 방지용
    min_frontier_size: 0.20     # 개척할 구역으로 인정하는 최소 크기(m). 좁은 방에 맞춰 0.2m로 매우 작게 설정하여 꼼꼼히 탐색