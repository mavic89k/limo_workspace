# ============================================================
# explore_lite (프론티어 기반 자율 탐색) 파라미터
# 프론티어 = 이미 아는 빈 공간과 아직 모르는 공간의 경계.
# 이 노드는 costmap을 읽어 프론티어를 찾고 Nav2에 이동 목표를 보낸다.
# 최상위 키(explore_node)는 launch의 Node name과 일치해야 한다.
# ============================================================
explore_node:
  ros__parameters:
    robot_base_frame: base_link                          # 로봇 본체 좌표계 (로봇 현재 위치 계산용)
    costmap_topic: /global_costmap/costmap               # 프론티어 탐색에 사용할 전역 costmap 토픽
    costmap_updates_topic: /global_costmap/costmap_updates # costmap 부분 갱신(diff) 토픽
    visualize: true                                      # RViz에 프론티어 마커 표시
    planner_frequency: 0.33     # 3초마다 새로운 프론티어 탐색 (단위 Hz, 0.33 ≈ 3초에 1회)
    progress_timeout: 25.0      # 이 시간(초) 동안 진전이 없으면 해당 프론티어를 포기하고 다음으로 전환 # 10초에서 25초로 변경
    potential_scale: 3.0        # 목표를 고를 때 '거리'를 얼마나 중요하게 볼지 가중치 (클수록 가까운 프론티어 우선)
    orientation_scale: 0.0      # (사용 안 함) 목표의 방향성 가중치
    gain_scale: 1.0             # 목표를 고를 때 '개척할 수 있는 면적'을 얼마나 중요하게 볼지 가중치 (클수록 넓은 미지 영역 우선)
    transform_tolerance: 0.6    # 좌표계(TF) 조회 시 허용하는 딜레이 오차 (0.6초) - CPU 과부하로 인한 에러 방지용
    min_frontier_size: 0.20     # 개척할 구역으로 인정하는 최소 크기(m). 좁은 방에 맞춰 0.2m로 매우 작게 설정하여 꼼꼼히 탐색
